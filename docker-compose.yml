services:
  php:
    build:
      context: ./docker
    volumes:
      - .:/var/www/html
    # `make serve` runs the workbench on http://localhost:8000. Only a run with
    # `--service-ports` publishes it, so the other targets never claim the port.
    ports:
      - "${SERVE_PORT:-8000}:8000"
    environment:
      # Coverage mode by default so `make test-coverage` works out of the box.
      # Override with XDEBUG_MODE=off for a faster plain run.
      XDEBUG_MODE: ${XDEBUG_MODE:-coverage}

  composer:
    build:
      context: ./docker
    volumes:
      - .:/var/www/html
    entrypoint: ["composer"]
    environment:
      # Coverage mode by default so `make test-coverage` works out of the box.
      # Override with XDEBUG_MODE=off for a faster plain run.
      XDEBUG_MODE: ${XDEBUG_MODE:-coverage}
